name: Deploy website

# Manual only. Runs in the "production" GitHub environment so it can be
# protected with required reviewers. Uses OIDC; no AWS keys are stored in GitHub.
# Setup: docs/github-actions.md
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and show what would be uploaded, without changing anything"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_CONTACT_API_URL: ${{ vars.NEXT_PUBLIC_CONTACT_API_URL }}
      NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
      NEXT_PUBLIC_LINKEDIN_URL: ${{ vars.NEXT_PUBLIC_LINKEDIN_URL }}
    steps:
      - name: Check required configuration
        run: |
          missing=0
          for v in AWS_REGION AWS_DEPLOY_ROLE_ARN SITE_BUCKET CLOUDFRONT_DISTRIBUTION_ID NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_CONTACT_API_URL; do
            if [ -z "${!v}" ]; then echo "::error::Environment variable $v is not set"; missing=1; fi
          done
          exit $missing
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload hashed assets
        run: >
          aws s3 sync out/_next/static "s3://${{ vars.SITE_BUCKET }}/_next/static"
          --cache-control "public, max-age=31536000, immutable"
          ${{ inputs.dry_run && '--dryrun' || '' }}

      - name: Upload pages
        run: >
          aws s3 sync out "s3://${{ vars.SITE_BUCKET }}" --delete --exclude "_next/static/*"
          --cache-control "public, max-age=0, s-maxage=300, must-revalidate"
          ${{ inputs.dry_run && '--dryrun' || '' }}

      - name: Invalidate CloudFront
        if: ${{ !inputs.dry_run }}
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
