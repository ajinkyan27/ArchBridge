AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Arcbridge Analytics static website hosting: private S3 bucket + CloudFront
  (Origin Access Control, HTTPS via ACM, security headers, clean-URL function).
  Nothing here is deployed automatically. See docs/deployment-aws.md.

Parameters:
  DomainNames:
    Type: CommaDelimitedList
    Description: Hostnames served by CloudFront, e.g. "www.example.com" or "example.com,www.example.com". Each must be covered by the certificate.
  AcmCertificateArn:
    Type: String
    Description: ARN of an ISSUED ACM certificate in us-east-1 (N. Virginia) covering every DomainNames entry.
    AllowedPattern: "^arn:aws[a-z-]*:acm:us-east-1:\\d{12}:certificate/.+$"
    ConstraintDescription: CloudFront requires the certificate to be in us-east-1.
  ContactApiOrigin:
    Type: String
    Description: Origin of the contact API for the Content-Security-Policy connect-src, e.g. https://abc123.execute-api.eu-west-2.amazonaws.com (no path).
    AllowedPattern: "^https://[a-zA-Z0-9.-]+$"
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: PriceClass_100 = North America and Europe edges (cheapest). Use PriceClass_All for best global latency.

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Versioning allows rolling back individual objects; old versions expire.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Keep in sync with infrastructure/cloudfront/url-rewrite.js (a unit test checks this).
  UrlRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-url-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Map clean URLs to index.html objects; redirect to trailing slash
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        var CANONICAL_HOST = "";

        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var host = request.headers.host ? request.headers.host.value : "";

          if (CANONICAL_HOST && host && host !== CANONICAL_HOST) {
            return redirect("https://" + CANONICAL_HOST + uri + queryString(request.querystring));
          }

          if (uri.charAt(uri.length - 1) === "/") {
            request.uri = uri + "index.html";
            return request;
          }

          var lastSegment = uri.substring(uri.lastIndexOf("/") + 1);
          if (lastSegment.indexOf(".") === -1) {
            return redirect(uri + "/" + queryString(request.querystring));
          }

          return request;
        }

        function redirect(location) {
          return {
            statusCode: 301,
            statusDescription: "Moved Permanently",
            headers: {
              location: { value: location },
              "cache-control": { value: "public, max-age=3600" },
            },
          };
        }

        function queryString(qs) {
          var parts = [];
          for (var key in qs) {
            var entry = qs[key];
            if (entry.multiValue) {
              for (var i = 0; i < entry.multiValue.length; i++) {
                parts.push(key + "=" + entry.multiValue[i].value);
              }
            } else {
              parts.push(key + (entry.value === "" ? "" : "=" + entry.value));
            }
          }
          return parts.length ? "?" + parts.join("&") : "";
        }

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: false
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            Override: true
            # 'unsafe-inline' for scripts is required by the Next.js static export,
            # which inlines its React Server Component payload.
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ${ContactApiOrigin}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "camera=(), microphone=(), geolocation=()"
              Override: true
            - Header: Cross-Origin-Opener-Policy
              Value: same-origin
              Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Arcbridge Analytics website
        Enabled: true
        Aliases: !Ref DomainNames
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed "CachingOptimized": respects Cache-Control set on each object at upload.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlRewriteFunction.FunctionMetadata.FunctionARN
        # A private bucket returns 403 for missing keys; show the site's 404 page for both.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadViaOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Description: Point your DNS CNAME record(s) at this hostname.
    Value: !GetAtt Distribution.DomainName
