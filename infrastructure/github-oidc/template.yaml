AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Optional. IAM role that GitHub Actions assumes via OIDC to deploy the static
  site (no long-lived AWS keys). Scoped to one repository + GitHub environment,
  one bucket and one CloudFront distribution. See docs/github-actions.md.

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub user or organisation that owns the repository.
  GitHubRepo:
    Type: String
    Description: Repository name (without owner).
  GitHubEnvironment:
    Type: String
    Default: production
    Description: GitHub environment the deploy job runs in. Only jobs in this environment can assume the role.
  SiteBucketName:
    Type: String
  DistributionId:
    Type: String
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set to "false" if this AWS account already has the token.actions.githubusercontent.com OIDC provider.

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: GitHub Actions deploy role for the Arcbridge website
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}/${GitHubRepo}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: deploy-static-site
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::${SiteBucketName}"
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject, s3:GetObject]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${SiteBucketName}/*"
              - Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DistributionId}"

Outputs:
  DeployRoleArn:
    Description: Store as the AWS_DEPLOY_ROLE_ARN variable on the GitHub environment.
    Value: !GetAtt DeployRole.Arn
